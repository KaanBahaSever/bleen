name: release

# Push a tag like v0.2.0-beta.1 to build and publish a release.
# Tags with a "-" (beta, rc) are published as pre-releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # dry run: build everything, publish nothing

permissions:
  contents: write

env:
  WAILS_VERSION: v2.16.0
  # Patched Go that still runs on Windows 7/8.1 (Go 1.21+ requires Windows 10).
  LEGACY_GO_TAG: patched-1.27.1

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - name: Build desktop app (Windows 10/11)
        working-directory: cmd/bleen
        run: |
          wails build -clean -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}"
          mkdir -p ../../dist
          cp ../../build/bin/bleen.exe ../../dist/bleen-windows-amd64.exe
      - name: Build bleenctl (Windows)
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X github.com/kaanbahasever/bleen/internal/cli.Version=${GITHUB_REF_NAME}" -o dist/bleenctl-windows-amd64.exe ./cmd/bleenctl
      - name: Fetch and verify the legacy Go toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$LEGACY_GO_TAG" -R XTLS/go-win7 -p "go-for-win7-windows-amd64.zip*" -D "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          want=$(grep '^SHA2-256=' go-for-win7-windows-amd64.zip.dgst | awk '{print $2}')
          got=$(sha256sum go-for-win7-windows-amd64.zip | awk '{print $1}')
          test "$want" = "$got" || { echo "checksum mismatch: $got != $want"; exit 1; }
          mkdir gowin7 && unzip -q go-for-win7-windows-amd64.zip -d gowin7
      - name: Build Windows 7/8.1 edition
        run: |
          export GOROOT="$(cygpath -w "$RUNNER_TEMP/gowin7")" GOTOOLCHAIN=local
          export PATH="$(cygpath -u "$RUNNER_TEMP/gowin7")/bin:$PATH"
          go version
          (cd cmd/bleen && wails build -skipbindings -trimpath -o bleen-win7-8.exe -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}")
          cp build/bin/bleen-win7-8.exe dist/bleen-windows7-8-amd64.exe
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/kaanbahasever/bleen/internal/cli.Version=${GITHUB_REF_NAME}" -o dist/bleenctl-windows7-8-amd64.exe ./cmd/bleenctl
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - name: Build bleen.app (Intel + Apple silicon)
        working-directory: cmd/bleen
        run: wails build -clean -trimpath -platform darwin/universal -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}"
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/bin/bleen.app dist/bleen-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install GTK and WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - name: Build
        working-directory: cmd/bleen
        run: wails build -clean -trimpath -tags webkit2_41 -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}"
      - name: Package
        run: |
          mkdir -p dist pkg/bleen
          cp build/bin/bleen pkg/bleen/
          cp build/appicon.png pkg/bleen/bleen.png
          cp packaging/linux/bleen.desktop packaging/linux/install.sh pkg/bleen/
          chmod +x pkg/bleen/install.sh pkg/bleen/bleen
          tar -C pkg -czf dist/bleen-linux-amd64.tar.gz bleen
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build bleenctl for Linux and macOS
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}; name=$os; [ "$os" = darwin ] && name=macos
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/kaanbahasever/bleen/internal/cli.Version=${GITHUB_REF_NAME}" \
              -o "dist/bleenctl-$name-$arch" ./cmd/bleenctl
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* $pre --title "bleen $GITHUB_REF_NAME" --notes "$notes"
